# Docker Compose configuration for testing
# Usage: docker compose -f docker-compose.test.yml up --abort-on-container-exit

services:
  # Test Database (isolated from dev)
  test-db:
    image: postgres:15-alpine
    container_name: skillsprout-test-db
    environment:
      POSTGRES_DB: skillsprout_test
      POSTGRES_USER: skillsprout_test
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsprout_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Test Redis (isolated from dev)
  test-redis:
    image: redis:7-alpine
    container_name: skillsprout-test-redis
    tmpfs:
      - /data  # Use tmpfs for faster tests
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Test Runner
  test-runner:
    build:
      context: .
      target: development
    container_name: skillsprout-test-runner
    environment:
      # Test environment
      APP_NAME: SkillSprout
      ENV: test
      DEBUG: "true"
      LOG_LEVEL: DEBUG

      # Database (test database)
      DATABASE_URL: postgresql+asyncpg://skillsprout_test:test_password@test-db:5432/skillsprout_test
      DATABASE_URL_SYNC: postgresql+psycopg2://skillsprout_test:test_password@test-db:5432/skillsprout_test

      # Redis
      REDIS_URL: redis://test-redis:6379/0

      # Celery
      CELERY_BROKER_URL: redis://test-redis:6379/0
      CELERY_RESULT_BACKEND: redis://test-redis:6379/1

      # O*NET (Demo mode for tests)
      DEMO_MODE: "true"
      ONET_USERNAME: ""
      ONET_PASSWORD: ""

      # Model Configuration
      MODEL_VERSION: v1_baseline_test
      MODEL_TRAINING_MIN_SAMPLES: 10  # Lower threshold for tests
    volumes:
      - .:/app
      - test_coverage:/app/htmlcov
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    networks:
      - test-network
    command: >
      sh -c "
        echo '========================================' &&
        echo 'Running Database Migrations...' &&
        echo '========================================' &&
        alembic upgrade head &&
        echo '' &&
        echo '========================================' &&
        echo 'Running Test Suite...' &&
        echo '========================================' &&
        pytest -v --tb=short --color=yes --cov=app --cov-report=html --cov-report=term &&
        echo '' &&
        echo '========================================' &&
        echo 'Test Results Summary' &&
        echo '========================================' &&
        echo 'Coverage report generated in htmlcov/' &&
        echo '========================================'
      "

volumes:
  test_coverage:
    driver: local

networks:
  test-network:
    driver: bridge
