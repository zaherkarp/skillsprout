name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Fast checks run first in parallel
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run ruff linter
        continue-on-error: true
        run: ruff check app/ ml/ tests/ --output-format=github

      - name: Run ruff formatter check
        continue-on-error: true
        run: ruff format --check app/ ml/ tests/

      - name: Run mypy type checking
        continue-on-error: true
        run: mypy app/ ml/ --ignore-missing-imports --no-error-summary

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: pip install pip-audit bandit

      - name: Run pip-audit for known vulnerabilities
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Run bandit security linter
        continue-on-error: true
        run: bandit -r app/ ml/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # Unit tests (fast, no external dependencies)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=app --cov=ml --cov-report=term --cov-report=html \
            -x --timeout=60 || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage-report
          path: htmlcov/
          retention-days: 30

  # Integration tests (with database and Redis via Docker)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and run integration tests
        run: |
          docker-compose -f docker-compose.test.yml build
          docker-compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from test-runner

      - name: Extract coverage report
        if: always()
        run: |
          CONTAINER_ID=$(docker create -v skillsprout_test_coverage:/data busybox) || true
          docker cp $CONTAINER_ID:/data/. ./htmlcov/ || true
          docker rm $CONTAINER_ID || true

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  # E2E tests
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker-compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: curl -f http://localhost:8000/api/v1/health || exit 1

      - name: Run E2E tests
        run: |
          chmod +x scripts/test_e2e.sh
          ./scripts/test_e2e.sh

      - name: Show API logs on failure
        if: failure()
        run: docker-compose logs api

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Build production image (only on main)
  build:
    name: Build Production Image
    runs-on: ubuntu-latest
    needs: [lint, security, integration-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          docker build --target production -t skillsprout:latest .
          echo "Image size:"
          docker images skillsprout:latest --format "{{.Size}}"
