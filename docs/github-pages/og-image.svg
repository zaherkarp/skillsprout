<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="50%" style="stop-color:#115e59"/>
      <stop offset="100%" style="stop-color:#134e4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="500" r="150" fill="rgba(255,255,255,0.03)"/>

  <!-- Logo -->
  <text x="100" y="200" font-family="Georgia, serif" font-size="64" fill="white" font-weight="bold">🌱 SkillSprout</text>

  <!-- Tagline -->
  <text x="100" y="280" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.85)">AI-Powered Career Transition Engine</text>

  <!-- Description -->
  <text x="100" y="350" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">O*NET skill matching · BLS employment projections · Claude AI narrative reports</text>

  <!-- Stats bar -->
  <rect x="80" y="410" width="1040" height="1" fill="rgba(255,255,255,0.15)"/>

  <text x="150" y="480" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="white" font-weight="bold" text-anchor="middle">978</text>
  <text x="150" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">TESTS</text>

  <text x="400" y="480" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="white" font-weight="bold" text-anchor="middle">910+</text>
  <text x="400" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">OCCUPATIONS</text>

  <text x="650" y="480" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="white" font-weight="bold" text-anchor="middle">35</text>
  <text x="650" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">O*NET SKILLS</text>

  <text x="900" y="480" font-family="Helvetica, Arial, sans-serif" font-size="42" fill="white" font-weight="bold" text-anchor="middle">3</text>
  <text x="900" y="510" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="2">BUCKET TIERS</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(0,0,0,0.15)"/>
  <text x="100" y="612" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.5)">github.com/zaherkarp/skillsprout</text>
  <text x="1100" y="612" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="end">FastAPI · Python · Open Source</text>
</svg>
