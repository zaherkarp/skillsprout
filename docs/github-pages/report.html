      TRAINABLE:    { label: "Trainable",    color: "#b8860b", bg: "#fdf6e3", icon: "trending" },

    // =============================================================================
    // CLAUDE API INTEGRATION
    // =============================================================================
    async function generateNarrative(apiKey, persona) {
      const recSummary = persona.recommendations.map(r => ({
        title: r.title,
        bucket: r.bucket,
        match: r.matchScore,
        gap: r.gapSeverity,
        gapSkills: r.gapSkills,
        blsGrowth: r.bls.growthPct,
        blsOutlook: r.bls.outlook,
        annualOpenings: r.bls.annualOpenings,
        trainingPath: r.training.path,
        trainingDuration: r.training.duration,
        trainingCost: r.training.estimatedCost,
      }));

      const skillSummary = [...persona.skills]
        .sort((a, b) => b.rating - a.rating)
        .slice(0, 6)
        .map(s => `${s.name}: ${s.rating}/4`);

      const prompt = `You are a career counselor writing a personalized career transition report for ${persona.name}, currently working as a ${persona.currentOccupation.title}.

Their top skills (self-rated on a 0-4 scale): ${skillSummary.join(", ")}

Their recommended career transitions (from the SkillSprout matching engine):
${JSON.stringify(recSummary, null, 2)}

Write a report with these exact JSON keys. Each value should be a string of 2-4 sentences, written in second person ("you"), warm but professional tone. Do not use markdown formatting inside the strings. Do not use em dashes. Do not ask rhetorical questions.

{
  "executive_summary": "A high-level overview of the person's career position, strongest transferable skills, and the overall landscape of their transition options.",
  "ready_now_narrative": "Analysis of the Ready Now recommendations. Why these are immediately accessible. What makes the person's existing skills a strong fit. Only discuss occupations with bucket READY_NOW.",
  "trainable_narrative": "Analysis of the Trainable recommendations. What training investment is needed and whether it's worthwhile given BLS projections. Only discuss occupations with bucket TRAINABLE.",
  "long_reskill_narrative": "Analysis of any Long Reskill options. Be honest about the time and cost commitment. Frame it in terms of whether the labor market projections justify the investment. Only discuss occupations with bucket LONG_RESKILL, or write 'None of your current recommendations fall into the long reskill category.' if there are none.",
  "labor_market_context": "A synthesis of the BLS employment projections across all recommendations. Which fields are growing fastest? Where is competition likely to be highest? What does the annual openings number tell us about practical job availability?",
  "next_steps": "Three to five concrete, specific actions the person should take in the next 30 days to begin their strongest transition. Be specific: name the certifications, websites, or programs. Number them 1, 2, 3, etc.",
  "closing": "An encouraging but grounded closing statement. Acknowledge the work ahead without being patronizing."
}

Respond with ONLY the JSON object. No preamble, no markdown backticks, no explanation outside the JSON.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
        }),
      });

      if (!response.ok) {
        throw new Error(`API error: ${response.status} ${response.statusText}`);
      }

      const data = await response.json();
      const textContent = data.content
        ?.filter(block => block.type === "text")
        .map(block => block.text)
        .join("");

      if (!textContent) throw new Error("No text in response");

      const cleaned = textContent.replace(/```json|```/g, "").trim();
      return JSON.parse(cleaned);
    }

    function SkillBar({ name, rating, importance }) {

            <div style={{
              height: "100%",

              background: `rgba(26, 78, 92, ${0.4 + impNorm * 0.6})`,
              borderRadius: 3,
              transition: "width 0.8s ease",
            }} />
          </div>
        </div>
      );
    }

          <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'DM Mono', monospace", color }}>{value}</div>
        </div>

    // =============================================================================

    // =============================================================================
    function SkillSproutReport() {
      const [selectedPersona, setSelectedPersona] = useState(null);
      const [narrative, setNarrative] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [apiKey, setApiKey] = useState("");
      const reportRef = useRef(null);

      async function handleGenerate(personaKey) {
        setSelectedPersona(personaKey);
        setNarrative(null);
        setError(null);
        setLoading(true);

        const storedKey = apiKey || localStorage.getItem("skillsprout_api_key") || "";
        if (!storedKey) {
          setError("No API key provided. The structured data is still displayed below. Enter an Anthropic API key to generate narrative sections.");
          setLoading(false);
          return;
        }

        try {
          const result = await generateNarrative(storedKey, PERSONAS[personaKey]);
          if (result) {
            setNarrative(result);
          } else {
            setError("The Claude API call did not return a valid response. The structured data is still displayed below.");
          }
        } catch (err) {
          console.error("Claude API error:", err);
          setError(`Claude API call failed: ${err.message}. The structured data is still displayed below.`);
        }
        setLoading(false);
      }

      function handleApiKeyChange(e) {
        const key = e.target.value;
        setApiKey(key);
        localStorage.setItem("skillsprout_api_key", key);
      }

      function handlePrint() {
        window.print();
      }

      const persona = selectedPersona ? PERSONAS[selectedPersona] : null;

      const byBucket = persona
        ? {
            ready: persona.recommendations.filter(r => r.bucket === "READY_NOW"),
            trainable: persona.recommendations.filter(r => r.bucket === "TRAINABLE"),
            longReskill: persona.recommendations.filter(r => r.bucket === "LONG_RESKILL"),
          }
        : {};

      return (
        <div style={{
          minHeight: "100vh",
          background: "#f5f0e8",
          fontFamily: "'DM Sans', Helvetica, sans-serif",
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap');
            @keyframes fadeSlideUp {
              from { opacity: 0; transform: translateY(12px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            @keyframes pulse {
              0%, 100% { opacity: 0.5; }
              50%      { opacity: 0.8; }
            }
            @media print {
              body { background: #fff !important; }
              .no-print { display: none !important; }
              .report-container {
                box-shadow: none !important;
                border: none !important;
              }
            }
          `}</style>

          {/* PERSONA SELECTOR */}
          {!selectedPersona && (
            <div style={{
              maxWidth: 640,
              margin: "0 auto",
              padding: "80px 24px",
              textAlign: "center",
              animation: "fadeSlideUp 0.5s ease both",
            }}>
              <h1 style={{
                fontSize: 36,
                fontFamily: "'Source Serif 4', Georgia, serif",
                fontWeight: 700,
                color: "#1a4e5c",
                margin: "0 0 8px",
              }}>
                SkillSprout
              </h1>
              <p style={{ fontSize: 14, color: "#888", fontFamily: "'DM Mono', monospace", margin: "0 0 40px" }}>
                Career Transition Report Generator
              </p>
              <p style={{ fontSize: 16, color: "#555", lineHeight: 1.7, marginBottom: 32, fontFamily: "'Source Serif 4', Georgia, serif" }}>
                Select a persona to generate a personalized career transition report.
                The report combines SkillSprout's O*NET-based skill matching with
                BLS employment projections and Claude-generated narrative analysis.
              </p>

              <div style={{
                maxWidth: 500,
                margin: "0 auto 32px",
                padding: "16px 24px",
                background: "#fff",
                border: "1px solid #e8e4de",
                borderRadius: 8,
                textAlign: "left",
              }}>
                <label htmlFor="api-key" style={{ fontSize: 13, fontWeight: 500, color: "#666" }}>
                  Anthropic API Key (optional)
                </label>
                <input
                  id="api-key"
                  type="password"
                  placeholder="sk-ant-..."
                  value={apiKey || localStorage.getItem("skillsprout_api_key") || ""}
                  onChange={handleApiKeyChange}
                  style={{
                    width: "100%",
                    marginTop: 6,
                    padding: "8px 12px",
                    border: "1px solid #d6d0c4",
                    borderRadius: 6,
                    fontFamily: "'DM Mono', monospace",
                    fontSize: 13,
                  }}
                />
                <div style={{ fontSize: 12, color: "#999", marginTop: 4 }}>
                  Required for AI-generated narrative sections. Stored locally in your browser.
                </div>
              </div>

              <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap" }}>
                {Object.entries(PERSONAS).map(([key, p]) => (
                  <button
                    key={key}
                    onClick={() => handleGenerate(key)}
                    style={{
                      padding: "16px 28px",
                      border: "2px solid #1a4e5c",
                      borderRadius: 6,
                      background: "#fff",
                      cursor: "pointer",
                      transition: "all 0.2s ease",
                      fontFamily: "'DM Sans', Helvetica, sans-serif",
                      color: "#1a4e5c",
                    }}
                    onMouseEnter={e => {
                      e.currentTarget.style.background = "#1a4e5c";
                      e.currentTarget.style.color = "#fff";
                    }}
                    onMouseLeave={e => {
                      e.currentTarget.style.background = "#fff";
                      e.currentTarget.style.color = "#1a4e5c";
                    }}
                  >
                    <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4 }}>{p.name}</div>
                    <div style={{ fontSize: 12, opacity: 0.8 }}>{p.currentOccupation.title}</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* GENERATED REPORT */}
          {persona && (
            <div ref={reportRef} style={{ maxWidth: 800, margin: "0 auto", padding: "40px 24px 80px" }}>
              {/* Toolbar */}
              <div className="no-print" style={{ display: "flex", justifyContent: "space-between", marginBottom: 24 }}>
                <button
                  onClick={() => { setSelectedPersona(null); setNarrative(null); setError(null); }}
                  style={{
                    padding: "8px 16px",
                    border: "1px solid #ccc",
                    borderRadius: 4,
                    background: "#fff",
                    cursor: "pointer",
                    fontSize: 13,
                    fontFamily: "'DM Sans', Helvetica, sans-serif",
                  }}
                >
                  Back
                </button>
                <button
                  onClick={handlePrint}
                  style={{
                    padding: "8px 16px",
                    border: "none",
                    borderRadius: 4,
                    background: "#1a4e5c",
                    color: "#fff",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    fontFamily: "'DM Sans', Helvetica, sans-serif",
                  }}
                >
                  Print Report
                </button>
              </div>

              {/* Report container */}
              <div className="report-container" style={{
                background: "#fff",
                borderRadius: 8,
                boxShadow: "0 2px 20px rgba(0,0,0,0.06)",
                border: "1px solid #e0d8c8",
                overflow: "hidden",
              }}>
                {/* Report header */}
                <div style={{
                  background: "linear-gradient(135deg, #1a4e5c 0%, #2a6e7e 100%)",
                  padding: "40px 40px 32px",
                  color: "#fff",
                }}>
                  <div style={{ fontSize: 11, fontFamily: "'DM Mono', monospace", opacity: 0.7, marginBottom: 4 }}>
                    SKILLSPROUT CAREER TRANSITION REPORT
                  </div>
                  <h1 style={{
                    fontSize: 28,
                    fontFamily: "'Source Serif 4', Georgia, serif",
                    fontWeight: 700,
                    margin: "0 0 6px",
                  }}>
                    {persona.name}'s Career Pathway Analysis
                  </h1>
                  <p style={{ fontSize: 15, margin: 0, opacity: 0.85, fontFamily: "'Source Serif 4', Georgia, serif" }}>
                    Current role: {persona.currentOccupation.title} ({persona.currentOccupation.code})
                  </p>
                  <div style={{ fontSize: 12, fontFamily: "'DM Mono', monospace", opacity: 0.6, marginTop: 12 }}>
                    Generated {new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}
                  </div>
                </div>

                {/* Report body */}
                <div style={{ padding: "32px 40px" }}>
                  {/* Skills Profile */}
                  <div style={{ marginBottom: 36 }}>
                    <h2 style={{
                      fontSize: 15,
                      fontFamily: "'DM Sans', Helvetica, sans-serif",
                      fontWeight: 700,
                      textTransform: "uppercase",
                      letterSpacing: "0.08em",
                      color: "#1a4e5c",
                      margin: "0 0 16px",
                      paddingBottom: 8,
                      borderBottom: "2px solid #1a4e5c22",
                    }}>
                      Skills Profile
                    </h2>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 32px" }}>
                      {[...persona.skills]
                        .sort((a, b) => b.rating - a.rating)
                        .map(s => (
                          <SkillBar key={s.id} name={s.name} rating={s.rating} importance={s.importance} />
                        ))}
                    </div>
                  </div>

                  {/* Loading skeleton */}
                  {loading && <LoadingSkeleton />}

                  {/* Error */}
                  {error && (
                    <div style={{ padding: "12px 16px", background: "#fdf6e3", border: "1px solid #e0d8c8", borderRadius: 4, marginBottom: 24, fontSize: 13, color: "#b8860b" }}>
                      {error}
                    </div>
                  )}

                  {/* Executive Summary */}
                  {narrative && (
                    <NarrativeSection title="Executive Summary" text={narrative.executive_summary} />
                  )}

                  {/* BLS Labor Market Projections */}
                  <div style={{ marginBottom: 32 }}>
                    <h2 style={{
                      fontSize: 15,
                      fontFamily: "'DM Sans', Helvetica, sans-serif",
                      fontWeight: 700,
                      textTransform: "uppercase",
                      letterSpacing: "0.08em",
                      color: "#1a4e5c",
                      margin: "0 0 16px",
                      paddingBottom: 8,
                      borderBottom: "2px solid #1a4e5c22",
                    }}>
                      Labor Market Projections (BLS 2024-2034)
                    </h2>
                    <BLSTable recommendations={persona.recommendations} />
                    {narrative && <NarrativeSection title="Labor Market Context" text={narrative.labor_market_context} accent="#2a6e7e" />}
                  </div>

                  {/* Ready Now */}
                  {byBucket.ready.length > 0 && (
                    <div style={{ marginBottom: 32 }}>
                      <h2 style={{
                        fontSize: 15,
                        fontFamily: "'DM Sans', Helvetica, sans-serif",
                        fontWeight: 700,
                        textTransform: "uppercase",
                        letterSpacing: "0.08em",
                        color: BUCKET_CONFIG.READY_NOW.color,
                        margin: "0 0 16px",
                        paddingBottom: 8,
                        borderBottom: `2px solid ${BUCKET_CONFIG.READY_NOW.color}22`,
                      }}>
                        Ready Now Opportunities
                      </h2>
                      {narrative && <NarrativeSection text={narrative.ready_now_narrative} accent={BUCKET_CONFIG.READY_NOW.color} />}
                      {byBucket.ready.map((r, i) => <RecommendationCard key={r.code} rec={r} index={i} />)}
                    </div>
                  )}

                  {/* Trainable */}
                  {byBucket.trainable.length > 0 && (
                    <div style={{ marginBottom: 32 }}>
                      <h2 style={{
                        fontSize: 15,
                        fontFamily: "'DM Sans', Helvetica, sans-serif",
                        fontWeight: 700,
                        textTransform: "uppercase",
                        letterSpacing: "0.08em",
                        color: BUCKET_CONFIG.TRAINABLE.color,
                        margin: "0 0 16px",
                        paddingBottom: 8,
                        borderBottom: `2px solid ${BUCKET_CONFIG.TRAINABLE.color}22`,
                      }}>
                        Trainable Opportunities
                      </h2>
                      {narrative && <NarrativeSection text={narrative.trainable_narrative} accent={BUCKET_CONFIG.TRAINABLE.color} />}
                      {byBucket.trainable.map((r, i) => <RecommendationCard key={r.code} rec={r} index={i} />)}
                    </div>
                  )}

                  {/* Long Reskill */}
                  {byBucket.longReskill.length > 0 && (
                    <div style={{ marginBottom: 32 }}>
                      <h2 style={{
                        fontSize: 15,
                        fontFamily: "'DM Sans', Helvetica, sans-serif",
                        fontWeight: 700,
                        textTransform: "uppercase",
                        letterSpacing: "0.08em",
                        color: BUCKET_CONFIG.LONG_RESKILL.color,
                        margin: "0 0 16px",
                        paddingBottom: 8,
                        borderBottom: `2px solid ${BUCKET_CONFIG.LONG_RESKILL.color}22`,
                      }}>
                        Long-Term Reskill Paths
                      </h2>
                      {narrative && <NarrativeSection text={narrative.long_reskill_narrative} accent={BUCKET_CONFIG.LONG_RESKILL.color} />}
                      {byBucket.longReskill.map((r, i) => <RecommendationCard key={r.code} rec={r} index={i} />)}
                    </div>
                  )}

                  {/* Next Steps & Closing */}
                  {narrative && (
                    <>
                      <NarrativeSection title="Your Next Steps (30 Days)" text={narrative.next_steps} accent="#1a4e5c" />
                      <NarrativeSection text={narrative.closing} accent="#888" />
                    </>
                  )}

                  {/* Footer */}
                  <div style={{
                    marginTop: 40,
                    paddingTop: 20,
                    borderTop: "1px solid #e8e4de",
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    fontSize: 11,
                    fontFamily: "'DM Mono', monospace",
                    color: "#aaa",
                  }}>
                    <span>SkillSprout Career Transition Report</span>
                    <span>Data: O*NET, BLS Employment Projections (2024-2034)</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SkillSproutReport />);
  </script>
</body>
</html>
