<html lang="en">
<head>

  <style>

    :root {
      --primary: #1a4e5c;
      --bg: #f5f0e8;
      --card-bg: #fff;
      --border: #d6d0c4;
      --border-light: #e8e4de;
      --ready-now: #1a7a4c;
      --trainable: #b8860b;
      --long-reskill: #9b2c2c;
      --text: #2d2d2d;
      --text-muted: #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ---- Toolbar ---- */
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px;
      background: var(--primary);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
    }
    .toolbar button {
      font-family: 'DM Sans', sans-serif;
      padding: 6px 16px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .toolbar button:hover { background: rgba(255,255,255,.12); }

    /* ---- Persona Selection ---- */
    .persona-screen {
      max-width: 640px;
      margin: 80px auto;
      text-align: center;
    }
    .persona-screen h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: var(--primary);
    }
    .persona-screen p {
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .persona-buttons {
      display: flex; flex-direction: column; gap: 12px;
    }
    .persona-btn {
      font-family: 'DM Sans', sans-serif;
      padding: 16px 24px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--card-bg);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, box-shadow .15s;
    }
    .persona-btn:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 12px rgba(26,78,92,.12);
    }
    .persona-btn strong { display: block; font-size: 16px; color: var(--primary); }
    .persona-btn span { font-size: 13px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

    /* ---- API Key Input ---- */
    .api-key-section {
      max-width: 640px; margin: 0 auto 24px;
      padding: 16px 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 10px;
    }
    .api-key-section label {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .api-key-section input {
      width: 100%; margin-top: 6px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
    }
    .api-key-section .hint {
      font-size: 12px; color: var(--text-muted); margin-top: 4px;
      font-family: 'DM Sans', sans-serif;
    }

    /* ---- Report Container ---- */
    .report { max-width: 900px; margin: 0 auto; padding: 24px; }

    /* ---- Report Header ---- */
    .report-header {
      background: linear-gradient(135deg, var(--primary), #2a7a8c);
      color: #fff;
      padding: 40px 32px;
      border-radius: 12px;
      margin-bottom: 32px;
    }
    .report-header h1 { font-size: 26px; margin-bottom: 4px; }
    .report-header .subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      opacity: .8;
    }
    .report-header .date {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      opacity: .6;
      margin-top: 8px;
    }

    /* ---- Section ---- */
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 28px 24px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 20px;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-light);
    }

    /* ---- Skills Grid ---- */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }
    .skill-row {
      display: flex; align-items: center; gap: 8px;
    }
    .skill-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      min-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .skill-bar-bg {
      flex: 1; height: 14px;
      background: var(--border-light);
      border-radius: 7px;
      overflow: hidden;
    }
    .skill-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 7px;
      transition: width .4s ease;
    }
    .skill-value {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 20px;
      text-align: right;
    }

    /* ---- Narrative ---- */
    .narrative {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
    }

    /* ---- Loading skeleton ---- */
    .skeleton {
      height: 16px;
      background: linear-gradient(90deg, var(--border-light) 25%, #ede9e0 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s ease-in-out infinite;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .skeleton:last-child { width: 60%; }

    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---- BLS Table ---- */
    .bls-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
    }
    .bls-table th {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 2px solid var(--border);
      color: var(--primary);
      font-weight: 600;
    }

      border-bottom: 1px solid var(--border-light);
    }
    .bls-table .mono {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    /* ---- Outlook Badge ---- */

      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .outlook-moderate { background: #fff3cd; color: #856404; }
    .outlook-stable { background: #e2e3e5; color: #383d41; }
    .outlook-declining { background: #f8d7da; color: #721c24; }

    /* ---- Recommendation Card ---- */
    .rec-card {

      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
      background: var(--card-bg);

    .rec-card-title {

    }
    .rec-card-code {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ---- Bucket Badge ---- */
    .bucket-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #fff;
    }
    .bucket-ready_now, .bucket-ready-now { background: var(--ready-now); }
    .bucket-trainable { background: var(--trainable); }
    .bucket-long_reskill, .bucket-long-reskill { background: var(--long-reskill); }

    /* ---- Metric Pills ---- */
    .metric-pills {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 12px;
    }
    .metric-pill {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #f0ede6;
      color: var(--text);
    }

    /* ---- Skill Tags ---- */
    .skill-tags {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 12px;
    }
    .skill-tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 6px;
      background: #e8f4f8;
      color: var(--primary);
    }

    /* ---- Training Path ---- */
    .training-box {
      background: #faf8f4;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .training-box .training-title {
      font-family: 'DM Sans', sans-serif;

      font-weight: 600;

      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .training-box ul {
      list-style: disc; padding-left: 18px;
      font-size: 13px;

    /* ---- Footer ---- */

      text-align: center;
      padding: 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
      margin-top: 32px;
    }

    /* ---- Warning ---- */

      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: #856404;
    }

    /* ---- Animations ---- */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Print ---- */
    @media print {
      .toolbar, .api-key-section { display: none !important; }
      body { background: #fff; }
      .report-header { break-inside: avoid; }
      .section { box-shadow: none; break-inside: avoid; }
      .rec-card { box-shadow: none; break-inside: avoid; }
    }
  </style>

    // ===== Utility functions =====
    function outlookClass(outlook) {
      if (outlook.includes("strong")) return "outlook-strong";
      if (outlook.includes("moderate")) return "outlook-moderate";
      if (outlook.includes("stable")) return "outlook-stable";
      return "outlook-declining";
    }

    function bucketLabel(bucket) {
      const labels = { ready_now: "Ready Now", trainable: "Trainable", long_reskill: "Long Reskill" };
      return labels[bucket] || bucket;
    }

    function bucketClass(bucket) {
      return "bucket-" + bucket.replace(/_/g, "-");
    }

    // ===== Claude API call =====
    async function callClaudeAPI(apiKey, persona) {
      const recSummary = persona.recommendations.map(r => ({
        title: r.title,
        bucket: r.bucket,
        match: r.match,
        gap: r.gap,
        blsGrowth: r.blsGrowth,
        blsOutlook: r.blsOutlook,
        trainingPath: r.training.path,
        duration: r.training.duration,
        cost: r.training.cost,
      }));

      const topSkills = persona.skills
        .sort((a, b) => b.rating - a.rating)
        .slice(0, 5)
        .map(s => `${s.name} (${s.rating}/4)`)
        .join(", ");

      const prompt = `You are a career counselor writing a professional career transition report for ${persona.name}, currently a ${persona.currentRole} (O*NET code ${persona.currentCode}).

Their top skills: ${topSkills}.

Recommendations summary (JSON): ${JSON.stringify(recSummary)}

Respond with ONLY a JSON object (no markdown fencing, no extra text) with these keys:
- executive_summary: 2-4 sentences providing an overview of this person's career transition prospects
- ready_now_narrative: 2-3 sentences about their Ready Now opportunities
- trainable_narrative: 2-3 sentences about their Trainable opportunities
- long_reskill_narrative: 2-3 sentences about their Long Reskill paths (if any; if none, write "No long reskill paths identified.")
- labor_market_context: 2-3 sentences about the labor market outlook for the recommended occupations
- next_steps: A numbered list (as a single string) of 4-5 concrete actions for the next 30 days
- closing: 2-3 sentences of encouragement and final advice`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
        }),
      });

      if (!response.ok) {
        throw new Error(`API error: ${response.status} ${response.statusText}`);
      }

      const data = await response.json();
      let text = data.content[0].text;
      // Strip markdown code fencing if present
      text = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "");
      return JSON.parse(text);
    }

          </thead>
          <tbody>
            {sorted.map(r => (
              <tr key={r.code}>
                <td>{r.title}</td>
                <td className="mono">{r.blsGrowth > 0 ? "+" : ""}{r.blsGrowth}%</td>
                <td className="mono">{r.blsOpenings.toLocaleString()}</td>
                <td className="mono">{r.blsEmployment.toLocaleString()}</td>
                <td><span className={`outlook-badge ${outlookClass(r.blsOutlook)}`}>{r.blsOutlook}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    function RecCard({ rec, index }) {
      return (
        <div className="rec-card" style={{animationDelay: `${index * 100}ms`}}>
          <div className="rec-card-header">
            <div>
              <span className="rec-card-title">{rec.title}</span>
              <span className="rec-card-code"> {rec.code}</span>
            </div>
            <span className={`bucket-badge ${bucketClass(rec.bucket)}`}>{bucketLabel(rec.bucket)}</span>
          </div>
          <div className="metric-pills">
            <span className="metric-pill">Match {rec.match}%</span>
            <span className="metric-pill">Gap {rec.gap}%</span>
            <span className="metric-pill">BLS Growth {rec.blsGrowth > 0 ? "+" : ""}{rec.blsGrowth}%</span>
            <span className="metric-pill">Openings {rec.blsOpenings.toLocaleString()}/yr</span>
          </div>
          <div className="skill-tags">
            {rec.skillsToDevelop.map(s => (
              <span className="skill-tag" key={s}>{s}</span>
            ))}
          </div>
          <div className="training-box">
            <div className="training-title">{rec.training.path}</div>
            <div className="training-meta">{rec.training.duration} · {rec.training.cost}</div>
            <ul>
              {rec.training.resources.map((r, i) => <li key={i}>{r}</li>)}
            </ul>
          </div>
        </div>
      );
    }

    function BucketSection({ title, narrative, recs }) {
      if (!recs || recs.length === 0) return null;
      return (
        <div className="section">
          <h2>{title}</h2>
          <div style={{marginBottom: 16}}>
            <NarrativeSection content={narrative} />
          </div>
          {recs.map((r, i) => <RecCard rec={r} index={i} key={r.code} />)}
        </div>
      );
    }

    // ===== Main App =====
    function App() {
      const [selectedPersona, setSelectedPersona] = React.useState(null);
      const [apiKey, setApiKey] = React.useState("");
      const [narratives, setNarratives] = React.useState(null);
      const [apiError, setApiError] = React.useState(null);

      async function selectPersona(key) {
        setSelectedPersona(key);
        setNarratives(null);
        setApiError(null);

        const storedKey = apiKey || localStorage.getItem("skillsprout_api_key") || "";
        if (!storedKey) {
          setApiError("No API key provided. Structured data is shown below. Enter an Anthropic API key to generate narrative sections.");
          return;
        }

        try {
          const result = await callClaudeAPI(storedKey, PERSONAS[key]);
          setNarratives(result);
        } catch (err) {
          console.error("Claude API error:", err);
          setApiError(`Claude API call failed: ${err.message}. Structured data is shown below.`);
        }
      }

      function handleApiKeyChange(e) {
        const key = e.target.value;
        setApiKey(key);
        localStorage.setItem("skillsprout_api_key", key);
      }

      // Persona selection screen
      if (!selectedPersona) {
        return (
          <div>
            <div className="persona-screen">
              <h1>SkillSprout Career Report</h1>
              <p>Select a persona to generate a personalized career transition report.</p>
              <div className="api-key-section">
                <label htmlFor="api-key">Anthropic API Key (optional)</label>
                <input
                  id="api-key"
                  type="password"
                  placeholder="sk-ant-..."
                  value={apiKey || localStorage.getItem("skillsprout_api_key") || ""}
                  onChange={handleApiKeyChange}
                />
                <div className="hint">Required for AI-generated narrative sections. Stored locally in your browser.</div>
              </div>
              <div className="persona-buttons">
                {Object.entries(PERSONAS).map(([key, p]) => (
                  <button className="persona-btn" key={key} onClick={() => selectPersona(key)}>
                    <strong>{p.name}</strong>
                    <span>{p.currentRole} ({p.currentCode}) — {p.recommendations.length} recommendations</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const persona = PERSONAS[selectedPersona];
      const readyNow = persona.recommendations.filter(r => r.bucket === "ready_now");
      const trainable = persona.recommendations.filter(r => r.bucket === "trainable");
      const longReskill = persona.recommendations.filter(r => r.bucket === "long_reskill");

      return (
        <div>
          <div className="toolbar">
            <button onClick={() => { setSelectedPersona(null); setNarratives(null); setApiError(null); }}>← Back</button>
            <span style={{flex:1}}></span>
            <button onClick={() => window.print()}>Print Report</button>
          </div>

          <div className="report">
            {/* Report Header */}
            <div className="report-header">
              <h1>Career Transition Report: {persona.name}</h1>
              <div className="subtitle">{persona.currentRole} · {persona.currentCode}</div>
              <div className="date">Generated {new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</div>
            </div>

            {apiError && <div className="warning-banner">{apiError}</div>}

            {/* Skills Profile */}
            <div className="section">
              <h2>Skills Profile</h2>
              <SkillsProfile skills={persona.skills} />
            </div>

            {/* Executive Summary */}
            <div className="section">
              <h2>Executive Summary</h2>
              <NarrativeSection content={narratives ? narratives.executive_summary : null} />
            </div>

            {/* Labor Market Projections */}
            <div className="section">
              <h2>Labor Market Projections</h2>
              <BLSTable recommendations={persona.recommendations} />
            </div>

            {/* Labor Market Context */}
            <div className="section">
              <h2>Labor Market Context</h2>
              <NarrativeSection content={narratives ? narratives.labor_market_context : null} />
            </div>

            {/* Recommendation Buckets */}
            <BucketSection
              title="Ready Now Opportunities"
              narrative={narratives ? narratives.ready_now_narrative : null}
              recs={readyNow}
            />
            <BucketSection
              title="Trainable Opportunities"
              narrative={narratives ? narratives.trainable_narrative : null}
              recs={trainable}
            />
            <BucketSection
              title="Long Reskill Paths"
              narrative={narratives ? narratives.long_reskill_narrative : null}
              recs={longReskill}
            />

            {/* Next Steps */}
            <div className="section">
              <h2>Next Steps (30 Days)</h2>
              <NarrativeSection content={narratives ? narratives.next_steps : null} />
            </div>

            {/* Closing */}
            <div className="section">
              <h2>Closing</h2>
              <NarrativeSection content={narratives ? narratives.closing : null} />
            </div>

            {/* Footer */}
            <div className="report-footer">
              <div>SkillSprout Career Transition Report</div>
              <div>Data: O*NET, BLS Employment Projections (2024–2034)</div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
